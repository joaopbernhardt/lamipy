[project]
name = "lamipy"
dynamic = ["version"]
description = "Laminated composites engineering simulations in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Joao Paulo Bernhardt" }]
keywords = ["composites", "laminates", "classical-laminate-theory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.2.6",
    "matplotlib>=3.10.9",
    # Matplotlib accepts Pillow >=8 and fontTools >=4.22. Those ranges include
    # releases with open advisories; 12.3.0 and 4.60.2 are the fixed floors.
    "pillow>=12.3.0",
    "fonttools>=4.60.2",
]

[project.urls]
Homepage = "https://github.com/joaopbernhardt/lamipy"
Repository = "https://github.com/joaopbernhardt/lamipy"

[project.scripts]
lamipy-demo = "lamipy.runfailuretest:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    # pytest accepts Pygments >=2.7.2, which includes a ReDoS fixed in 2.20.0.
    "pygments>=2.20.0",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "lamipy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lamipy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
